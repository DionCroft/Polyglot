name: Offline accent evaluation on Apple Silicon
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accent-evaluation:
    runs-on: macos-14
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: arm64
          cache: pip
          cache-dependency-path: requirements-macos-lock.txt
      - name: Prepare pinned models and public fixtures
        run: |
          python -c "import platform; assert platform.machine() == 'arm64'; print(platform.platform())"
          python -m pip install --only-binary=:all: --require-hashes -r requirements-macos-lock.txt
          python -m scripts.setup_macos
          command -v ffmpeg || brew install ffmpeg
          python -m scripts.prepare_vctk_fixtures
          mkdir -p tests/artifacts
      - name: Evaluate offline CPU Base and Small with both recognition modes
        run: |
          for backend in cpu cpu-small; do
            for mode in standard careful; do
              python -m scripts.evaluate_speech --manifest tests/fixtures/vctk-accent-cases.json --backend "$backend" --mode "$mode" --language-check --output "tests/artifacts/mac-accent-${backend}-${mode}.json"
            done
          done
      - name: Retain all completed measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-accent-evaluation
          path: tests/artifacts/mac-accent-*.json
          if-no-files-found: warn
          retention-days: 30
