name: Publish tested macOS beta
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful macOS Apple Silicon build run ID
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      RELEASE_TAG: macos-v0.7.0b1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require a successful trusted main-branch build and a draft release
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          run_id = os.environ['RUN_ID']
          assert run_id.isdecimal(), 'Expected numeric run ID'
          run = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GH_REPO']}/actions/runs/{run_id}"]))
          assert run['conclusion'] == 'success' and run['head_branch'] == 'main'
          assert run['path'] == '.github/workflows/macos.yml' and run['event'] in ('push', 'workflow_dispatch')
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', os.environ['RELEASE_TAG'], '--json', 'isDraft,targetCommitish']))
          assert release['isDraft'], 'Only publish a prepared draft; never replace a published release'
          assert release['targetCommitish'] == run['head_sha'], 'Draft must target the exact tested commit'
          print('Verified successful native build', run['head_sha'])
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: LectureLive-0.7.0b1-macOS-AppleSilicon
          path: downloads
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact native distribution bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          folder = Path('downloads')
          wanted = {'LectureLive-0.7.0b1-macOS-AppleSilicon.dmg', 'LectureLive-0.7.0b1-macOS-AppleSilicon.zip'}
          records = {}
          for line in (folder / 'SHA256SUMS.txt').read_text().splitlines():
              digest, name = line.split()
              assert name in wanted and name not in records
              with (folder / name).open('rb') as stream:
                  actual = hashlib.file_digest(stream, 'sha256').hexdigest()
              assert actual == digest, name
              records[name] = digest
              print('Verified', name, digest)
          assert set(records) == wanted
          PY
          cp docs/MACOS.md downloads/INSTALL-MAC.md
      - name: Attach verified installers and publish the prepared beta
        run: |
          gh release upload "$RELEASE_TAG" downloads/*.dmg downloads/*.zip downloads/SHA256SUMS.txt downloads/INSTALL-MAC.md
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,assets
