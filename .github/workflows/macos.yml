name: macOS Apple Silicon
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/*macos*'
      - '*macOS.spec'
      - '*macos*lock*'
      - 'assets/**'
      - 'glossaries/**'
      - 'docs/MACOS.md'
      - '.github/workflows/macos.yml'
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-test:
    runs-on: macos-14
    timeout-minutes: 55
    env:
      PYTHONUTF8: '1'
      LECTURELIVE_DATA: ${{ github.workspace }}/tests/macos-ci-data
      LECTURELIVE_TEST_WAV: ${{ github.workspace }}/tests/fixtures/jfk.wav
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: arm64
          cache: pip
          cache-dependency-path: requirements-macos-lock.txt
      - name: Install pinned native dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-macos-lock.txt
      - name: Verify Apple Silicon environment
        run: |
          python -c "import platform; assert platform.machine() == 'arm64'; print(platform.platform())"
          python -c "import onnxruntime as o; print(o.__version__, o.get_available_providers())"
      - name: Download pinned local models and test fixture
        run: |
          python -m scripts.setup_macos
          python -m scripts.setup_macos --verify --offline
          python -m scripts.setup_assets --fixtures
          python -m scripts.prepare_conversation_fixtures
          python -m scripts.prepare_auto_fixtures --limit-per-language 6
      - name: Tests
        run: |
          mkdir -p tests/artifacts
          python -m pytest -q --junitxml=tests/artifacts/macos-pytest.xml
          python -m ruff check app scripts/setup_macos.py scripts/build_macos.py scripts/package_macos.py --select E9,F63,F7,F82
      - name: Evaluate automatic language decisions on public speech
        run: python -m scripts.evaluate_auto_language --limit 6 --accelerator cpu --output tests/artifacts/macos-auto-evaluation.json
      - name: Build native app and verify signature
        run: python -m scripts.build_macos
      - name: Test packaged inference and native Cocoa UI
        run: |
          dist/LectureLive.app/Contents/MacOS/LectureLive --self-test tests/fixtures/jfk.wav tests/artifacts/macos-packaged.json
          dist/LectureLive.app/Contents/MacOS/LectureLive --mac-ui-test tests/artifacts/macos-ui.json
          dist/LectureLive.app/Contents/MacOS/LectureLive --conversation-self-test tests/fixtures tests/artifacts/macos-conversations.json
          dist/LectureLive.app/Contents/MacOS/LectureLive --conversation-ui-test tests/fixtures tests/artifacts/macos-conversation-ui.json
          dist/LectureLive.app/Contents/MacOS/LectureLive --auto-self-test tests/fixtures tests/artifacts/macos-auto.json
          dist/LectureLive.app/Contents/MacOS/LectureLive --auto-ui-test tests/fixtures tests/artifacts/macos-auto-ui.json
          codesign --verify --deep --strict dist/LectureLive.app
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" dist/LectureLive.app/Contents/Info.plist
      - name: Create DMG and ZIP
        run: python -m scripts.package_macos
      - name: Upload installable beta
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LectureLive-0.7.0b1-macOS-AppleSilicon
          path: dist/macos-release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-validation
          path: |
            tests/artifacts/macos-*
            tests/macos-ci-data/logs/*
          retention-days: 30
